  <!-- Letra P estilizada -->
  <path d="M 42 28
           L 42 92
           M 42 28
           L 68 28
           Q 84 28 84 46
           Q 84 64 68 64
           L 42 64"
        stroke="#ffffff"
        stroke-width="11"
