server.port=8084
spring.application.name=price-service

eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka}

spring.artemis.mode=embedded
spring.artemis.embedded.enabled=true

app.assets=bitcoin,ethereum,solana,ripple
app.price.interval=30000

coingecko.base-url=https://api.coingecko.com/api/v3

management.endpoints.web.exposure.include=health
management.health.jms.enabled=false

spring.datasource.url=jdbc:postgresql://localhost:5432/price_db
spring.datasource.username=postgres
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
